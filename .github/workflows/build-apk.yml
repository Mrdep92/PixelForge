name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Unit tests
        shell: bash
        run: gradle testDebugUnitTest --stacktrace 2>&1 | tee test.log

      - name: Build debug APK
        shell: bash
        run: gradle assembleDebug --stacktrace 2>&1 | tee build.log

      - name: Ringkas error build
        if: failure()
        shell: bash
        run: |
          msg=$(cat test.log build.log 2>/dev/null | grep -E '^e: |error:|What went wrong|FAILED|Execution failed|AssertionError|expected' -A3 | head -60 | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Build errors::$msg"

      - uses: actions/upload-artifact@v4
        with:
          name: PixelForge-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk PixelForge.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest PixelForge.apk \
            --title "PixelForge (latest build)" \
            --notes "Debug APK dari commit ${GITHUB_SHA::7}. Unduh PixelForge.apk lalu install."
